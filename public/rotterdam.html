<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cruiseschip Rotterdam tracker</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="layout">
      <section class="card">
        <p class="eyebrow">Nieuwe pagina</p>
        <h1>Cruiseschip Rotterdam</h1>
        <p id="summary">Status wordt geladen…</p>
        <dl class="details">
          <div>
            <dt>Laatste positie</dt>
            <dd id="position">-</dd>
          </div>
          <div>
            <dt>Laatste check</dt>
            <dd id="checkedAt">-</dd>
          </div>
          <div>
            <dt>Afstand sinds vorige meting</dt>
            <dd id="distance">-</dd>
          </div>
          <div>
            <dt>Email</dt>
            <dd id="emailStatus">-</dd>
          </div>
        </dl>
        <div id="alertBanner" class="alert hidden" role="alert" aria-hidden="true">
          Het schip is meer dan 10 meter verplaatst.
        </div>
        <p>
          <a id="mapLink" href="#" target="_blank" rel="noreferrer">Open locatie op kaart</a>
        </p>
        <button id="refreshButton" type="button">Nu controleren</button>
      </section>
    </main>
    <script>
      const summary = document.getElementById('summary');
      const position = document.getElementById('position');
      const checkedAt = document.getElementById('checkedAt');
      const distance = document.getElementById('distance');
      const emailStatus = document.getElementById('emailStatus');
      const alertBanner = document.getElementById('alertBanner');
      const mapLink = document.getElementById('mapLink');
      const refreshButton = document.getElementById('refreshButton');
      let lastAlertAt = null;
      let refreshTimer = null;

      function showClientError(message) {
        updateView({
          shipName: 'Rotterdam',
          currentPosition: null,
          distanceMeters: 0,
          lastCheckedAt: new Date().toISOString(),
          lastEmailStatus: null,
          alertActive: false,
          error: message
        });
      }

      function formatDate(value) {
        if (!value) return '-';
        return new Date(value).toLocaleString('nl-NL');
      }

      function scheduleRefresh(intervalMs) {
        const nextInterval = Math.max(1000, Number(intervalMs) || 30000);

        if (refreshTimer) {
          clearInterval(refreshTimer);
        }

        refreshTimer = setInterval(loadStatus, nextInterval);
      }

      function updateView(status) {
        summary.textContent = status.error
          ? status.error
          : `Tracking actief voor ${status.shipName}.`;

        if (status.currentPosition) {
          const { latitude, longitude } = status.currentPosition;
          position.textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
          mapLink.href = `https://www.openstreetmap.org/?mlat=${latitude}&mlon=${longitude}#map=12/${latitude}/${longitude}`;
          mapLink.removeAttribute('aria-disabled');
          mapLink.removeAttribute('tabindex');
        } else {
          position.textContent = '-';
          mapLink.removeAttribute('href');
          mapLink.setAttribute('aria-disabled', 'true');
          mapLink.setAttribute('tabindex', '-1');
        }

        checkedAt.textContent = formatDate(status.lastCheckedAt);
        distance.textContent = `${Number(status.distanceMeters || 0).toFixed(2)} meter`;
        emailStatus.textContent = status.lastEmailStatus
          ? `${status.lastEmailStatus.sent ? 'Verstuurd' : 'Niet verstuurd'} (${status.lastEmailStatus.reason})`
          : 'Nog niet verzonden';

        alertBanner.classList.toggle('hidden', !status.alertActive);
        alertBanner.setAttribute('aria-hidden', String(!status.alertActive));

        if (status.alertActive && status.lastAlertAt && status.lastAlertAt !== lastAlertAt) {
          lastAlertAt = status.lastAlertAt;
          alertBanner.textContent = `Het schip is meer dan 10 meter verplaatst om ${formatDate(status.lastAlertAt)}.`;
        }

        if (!status.alertActive) {
          alertBanner.textContent = 'Het schip is meer dan 10 meter verplaatst.';
        }

        scheduleRefresh(status.pollIntervalMs);
      }

      async function loadStatus() {
        try {
          const response = await fetch('/api/rotterdam/status');
          if (!response.ok) {
            throw new Error('Status ophalen mislukt.');
          }

          const status = await response.json();
          updateView(status);
        } catch (error) {
          showClientError(error.message);
        }
      }

      async function pollNow() {
        refreshButton.disabled = true;
        try {
          const response = await fetch('/api/rotterdam/poll', { method: 'POST' });
          if (!response.ok) {
            throw new Error('Nieuwe meting ophalen mislukt.');
          }

          const status = await response.json();
          updateView(status);
        } catch (error) {
          showClientError(error.message);
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener('click', pollNow);
      loadStatus();
    </script>
  </body>
</html>
